name: SQL Protocol Benchmark

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run SQL Protocol Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: 1.12.3.1577
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Clojure dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clj-deps-${{ runner.os }}-

      - name: Run SQL Protocol Benchmark
        run: |
          chmod +x scripts/run_benchmark.sh
          mkdir -p benchmark-results
          ./scripts/run_benchmark.sh
        continue-on-error: true
