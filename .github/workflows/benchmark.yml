name: SQL Protocol Benchmark

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run SQL Protocol Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          cli: 1.12.3.1577
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clj-deps-${{ runner.os }}-

      - name: Run SQL Protocol Benchmark
        run: |
          chmod +x scripts/run_benchmark.sh
          mkdir -p benchmark-results
          ./scripts/run_benchmark.sh
        continue-on-error: true
