name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx3g -Xms1g"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          cli: 1.12.3.1577
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clj-deps-${{ runner.os }}-

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global init.defaultBranch "main"

      - name: Kill conflicting processes
        run: |
          pkill -f "redis" || true
          pkill -f "java.*chrondb" || true
          sleep 2

      - name: Run coverage (PR — skip external protocols)
        if: github.event_name == 'pull_request'
        run: clojure -M:coverage-non-external-protocol

      - name: Run coverage (main — full)
        if: github.event_name != 'pull_request'
        run: clojure -M:coverage
